                        <div class="mb-4 p-3 rounded-4" style="background:rgba(255,140,0,0.05);border:1px solid rgba(255,140,0,0.12);">
                            <label class="fw-semibold small text-muted d-block mb-2"><i class="bi bi-ticket-perforated text-orange me-1"></i>Números de Reserva</label>
                            <p class="small text-secondary mb-2">Ingresa los números de reserva disponibles para este formulario. Puedes escribirlos uno por línea o separados por comas.</p>
                            <textarea id="formReservationNumbers" class="form-control rounded-3 mb-2" rows="4" placeholder="Ejemplo:&#10;RES-001&#10;RES-002&#10;RES-003"></textarea>
                        </div>

                        <div class="d-flex gap-2 justify-content-end border-top pt-3">
                            <button class="btn btn-orange rounded-pill px-5 py-2 fw-bold shadow-sm" onclick="saveForm()">
                                <i class="bi bi-check-lg me-1"></i>Guardar Formulario
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- PANEL DERECHO: Vista Previa en Vivo -->
            <div class="col-lg-6">
                <div class="sticky-top" style="top: 80px;">
                    <div class="d-flex align-items-center mb-2">
                        <small class="fw-bold text-secondary"><i class="bi bi-phone me-1"></i>VISTA PREVIA EN VIVO</small>
                    </div>
                    <div class="card border-0 shadow" style="border-radius: 16px; max-height: 85vh; overflow-y: auto; background: linear-gradient(135deg, #fff8f0, #ffffff);">
                        <div class="card-body p-4" id="livePreview">
                            <!-- Se renderiza dinámicamente -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- VISOR DE RESPUESTAS -->
    <div id="responsesViewer" class="d-none">
        <div class="card glass-panel border-0 shadow-sm">
            <div class="card-body">
                <div class="d-flex align-items-center justify-content-between mb-3 flex-wrap gap-2">
                    <h4 class="fw-bold mb-0" id="responsesTitle">Respuestas</h4>
                    <div class="d-flex gap-2 flex-wrap align-items-center">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="addMembrete" checked>
                            <label class="form-check-label small fw-semibold" for="addMembrete">Agregar Membrete</label>
                        </div>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="includeFecha" checked>
                            <label class="form-check-label small fw-semibold" for="includeFecha">Incluir Fecha</label>
                        </div>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="includeFichaMedica" checked>
                            <label class="form-check-label small fw-semibold" for="includeFichaMedica">Incluir Ficha Médica</label>
                        </div>
                        <button class="btn btn-sm btn-outline-warning rounded-pill" onclick="openReservationModal()">
                            <i class="bi bi-list-check me-1"></i>Números de Reserva
                        </button>
                        <button class="btn btn-sm btn-outline-danger rounded-pill" onclick="exportResponses('pdf')">
                            <i class="bi bi-file-earmark-pdf me-1"></i>PDF
                        </button>
                        <button class="btn btn-sm btn-outline-info rounded-pill" onclick="exportResponses('txt')">
                            <i class="bi bi-file-earmark-text me-1"></i>TXT
                        </button>
                        <button class="btn btn-sm btn-outline-success rounded-pill" onclick="exportResponses('xlsx')">
                            <i class="bi bi-file-earmark-excel me-1"></i>Excel
                        </button>
                        <button class="btn btn-sm btn-outline-secondary rounded-pill" onclick="copyResponsesTSV()" id="btnCopyTSV">
                            <i class="bi bi-clipboard-data me-1"></i>Copiar tabla
                        </button>
                        <button class="btn btn-sm btn-outline-primary rounded-pill" onclick="exportResponses('json')">
                            <i class="bi bi-filetype-json me-1"></i>JSON
                        </button>
                        <button class="btn btn-sm btn-outline-success rounded-pill" onclick="exportResponses('whatsapp')">
                            <i class="bi bi-whatsapp me-1"></i>WhatsApp
                        </button>
                        <button class="btn btn-sm btn-outline-secondary rounded-pill" onclick="backToList()">
                            <i class="bi bi-arrow-left me-1"></i>Volver
                        </button>
                    </div>
                </div>
                <div id="responsesTable" class="table-responsive"></div>
            </div>
        </div>
    </div>
</div>
