<div class="d-md-none fixed-bottom bg-surface border-top border-pastel p-2" style="border-radius:1.25rem 1.25rem 0 0;">
    <div class="d-flex justify-content-around align-items-center">
        <a href="/" class="text-center text-decoration-none text-muted-pastel" title="Inicio">
            <i class="bi bi-house-door fs-4 pastel-icon-mint"></i>
            <div class="small" style="font-size:0.65rem;">Inicio</div>
        </a>
        {% if session.get('user_id') %}
            <a href="{{ url_for('main.profile') }}" class="text-center text-decoration-none text-muted-pastel" title="Perfil">
                <i class="bi bi-person fs-4 pastel-icon-lavender"></i>
                <div class="small" style="font-size:0.65rem;">Perfil</div>
            </a>
        {% else %}
            <a href="{{ url_for('main.login_page') }}" class="text-center text-decoration-none text-muted-pastel" title="Ingresar">
                <i class="bi bi-box-arrow-in-right fs-4 pastel-icon-sky"></i>
                <div class="small" style="font-size:0.65rem;">Ingresar</div>
            </a>
        {% endif %}
    </div>
</div>
