{% if session.get('role') == 'Superusuario' %}
<div class="modal fade" id="configLogoSuenosModal" tabindex="-1" style="z-index:1060;">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg" style="border-radius: 1.5rem;">
            <div class="modal-header border-0 pb-3 pt-4 px-4">
                <h5 class="modal-title fw-bold fs-5"><i class="bi bi-gear-fill text-orange me-2"></i>Configurar Logo Sueños</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body pt-2 px-4 pb-4">
                <div class="form-check form-switch mb-4">
                    <input class="form-check-input" type="checkbox" id="logoMostrarToggle" style="cursor: pointer;">
                    <label class="form-check-label fw-bold" for="logoMostrarToggle" style="cursor: pointer;">Mostrar Logo</label>
                </div>
                <div class="mb-3">
                    <label class="form-label small text-secondary fw-bold">Enlace al hacer clic</label>
                    <input type="url" id="logoEnlace" class="form-control glass-input" placeholder="https://ejemplo.com">
                </div>
                <div class="mb-3">
                    <label class="form-label small text-secondary fw-bold">O seleccionar un evento activo</label>
                    <select id="logoEventoSelect" class="form-select glass-input" onchange="seleccionarEvento()">
                        <option value="">-- Seleccionar evento --</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label small text-secondary fw-bold">Tamaño en PC (px)</label>
                    <input type="number" id="logoTamañoPC" class="form-control glass-input" value="150" min="50" max="500">
                </div>
                <div class="mb-3">
                    <label class="form-label small text-secondary fw-bold">Tamaño en Móvil (px)</label>
                    <input type="number" id="logoTamañoMobile" class="form-control glass-input" value="120" min="30" max="300">
                </div>
                <div class="mb-3">
                    <label class="form-label small text-secondary fw-bold">Posición desde borde PC (px)</label>
                    <div class="row g-2">
                        <div class="col-6"><input type="number" id="logoPosicionLeft" class="form-control glass-input" value="20" placeholder="Izquierda"></div>
                        <div class="col-6"><input type="number" id="logoPosicionBottom" class="form-control glass-input" value="100" placeholder="Abajo"></div>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label small text-secondary fw-bold">Nombre del archivo de imagen</label>
                    <input type="text" id="logoNombreArchivo" class="form-control glass-input" value="logosueños.png" placeholder="ejemplo.png">
                </div>
                <button class="btn btn-orange fw-bold w-100 py-3 shadow rounded-pill" onclick="guardarConfigLogoSuenos()">
                    <i class="bi bi-check-lg me-2"></i>Guardar Configuración
                </button>
                <button class="btn btn-outline-secondary fw-bold w-100 py-3 shadow rounded-pill mt-2" onclick="limpiarCachéChrome()">
                    <i class="bi bi-arrow-counterclockwise me-2"></i>Limpiar Caché y Recargar PWA
                </button>
            </div>
        </div>
    </div>
</div>
{% endif %}
