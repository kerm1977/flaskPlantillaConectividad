
<div class="row justify-content-center animate__animated animate__fadeIn">
    <div class="col-lg-12 col-xl-10">
        
        <div class="glass-panel rounded-5 p-4 p-md-5 mb-4 position-relative border-0 shadow-lg">
            <h2 class="fw-bold text-dark mb-4 text-center text-md-start">
                <i class="bi bi-speedometer2 text-orange me-2"></i>Dashboard de Administración
            </h2>
            
            <!-- VISTA 1: Lista de Contactos -->
            <div id="adminUsersList">
                <div class="d-flex flex-column flex-md-row justify-content-between mb-3 gap-3">
                    <div class="input-group shadow-sm rounded-pill overflow-hidden w-100">
                        <span class="input-group-text bg-white border-0"><i class="bi bi-search text-orange"></i></span>
                        <input type="text" class="form-control border-0 py-2 bg-white" id="searchUserInput" placeholder="Buscar por nombre, cédula, correo o teléfono...">
                    </div>
                    <button class="btn bg-white rounded-pill px-4 flex-shrink-0 shadow-sm fw-bold" style="color: #ff8c00; border: 2px solid #ff8c00;" onclick="loadAllUsers()">
                        <i class="bi bi-arrow-clockwise me-1"></i> Actualizar
                    </button>
                </div>

                <!-- Contadores -->
                <div class="d-flex gap-2 flex-wrap mb-3" id="contactCounters">
                    <span class="badge rounded-pill fw-semibold px-3 py-2" style="background:rgba(0,0,0,0.07);color:#333;font-size:0.8rem;">
                        <i class="bi bi-people-fill text-orange me-1"></i>Total: <span id="countTotal">—</span>
                    </span>
                    <span class="badge rounded-pill fw-semibold px-3 py-2" style="background:rgba(25,135,84,0.12);color:#157347;font-size:0.8rem;">
                        <i class="bi bi-person-check-fill me-1"></i>Usuarios registrados: <span id="countUsers">—</span>
                    </span>
                    <span class="badge rounded-pill fw-semibold px-3 py-2" style="background:rgba(13,110,253,0.1);color:#0a58ca;font-size:0.8rem;">
                        <i class="bi bi-card-list me-1"></i>Solo CRM: <span id="countHikers">—</span>
                    </span>
                </div>

                <!-- Exportar / Importar BD -->
                <div class="d-flex flex-wrap gap-2 mb-3 align-items-center">
                    <span class="fw-bold text-dark small"><i class="bi bi-database-down text-orange me-1"></i>Base de Datos:</span>
                    <button class="btn btn-sm btn-outline-success rounded-pill fw-bold px-3" onclick="dashExportJSON()">
                        <i class="bi bi-filetype-json me-1"></i>JSON
                    </button>
                    <button class="btn btn-sm btn-outline-primary rounded-pill fw-bold px-3" onclick="dashExportExcel()">
                        <i class="bi bi-file-earmark-spreadsheet me-1"></i>Excel
                    </button>
                    <label class="btn btn-sm btn-outline-warning rounded-pill fw-bold px-3 text-dark mb-0" style="cursor:pointer;">
                        <i class="bi bi-upload me-1"></i>Importar
                        <input type="file" id="dashImportInput" accept=".json" class="d-none" onchange="dashImportJSON(this)">
                    </label>
                </div>
                <div id="dashDbMsg" class="mb-3 d-none small"></div>

                <div class="table-responsive glass-table-container rounded-4 p-2 shadow-sm">
                    <table class="table table-hover table-glass align-middle mb-0">
                        <thead>
                            <tr>
                                <th class="border-0 rounded-start fw-bold py-3">Nombre / Contacto</th>
                                <th class="border-0 fw-bold py-3 d-none d-sm-table-cell">Tipo</th>
                                <th class="border-0 fw-bold py-3 d-none d-sm-table-cell">Estado</th>
                                <th class="border-0 rounded-end text-end text-sm-center fw-bold py-3">Ver</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                            <tr><td colspan="4" class="text-center py-4 text-muted"><i class="bi bi-hourglass-split me-2"></i>Cargando registros...</td></tr>
                        </tbody>
                    </table>
                </div>
                <!-- Paginación -->
                <div id="dashPaginationBar" class="d-flex justify-content-center flex-wrap gap-2 mt-3 pb-2"></div>
            </div>

            <!-- VISTA 2: Detalle Absoluto del Usuario (Oculto por defecto) -->
            <div id="adminUserDetails" class="d-none animate__animated animate__fadeInRight">
                <!-- Botón Volver -->
                <button class="btn bg-white rounded-pill px-4 shadow-sm mb-4 fw-bold w-100 w-md-auto" style="color: #6c757d; border: 1px solid #ced4da;" onclick="showUsersList()">
                    <i class="bi bi-arrow-left me-1"></i>Volver a la lista
                </button>
                
                <div class="glass-table-container p-3 p-md-5 rounded-4 mb-4" id="userDetailsContent">
                    <!-- El contenido detallado se inyecta por JS -->
                </div>

                <div class="d-flex flex-column flex-md-row gap-2 justify-content-end border-top border-white border-opacity-50 pt-4" id="detailActionBar">
                    <button class="btn btn-warning rounded-pill px-4 shadow-sm fw-bold btn-action-mobile text-dark" id="btnBlockUser" onclick="toggleUserStatus()">
                        <i class="bi bi-slash-circle me-1"></i>Bloquear Acceso
                    </button>
                    <button class="btn bg-white rounded-pill px-4 shadow-sm fw-bold btn-action-mobile" style="color: #ff8c00; border: 2px solid #ff8c00;" id="btnEditUserAdmin" onclick="openEditUserModal()">
                        <i class="bi bi-pencil-square me-1"></i>Editar Datos
                    </button>
                    <button class="btn btn-danger rounded-pill px-4 shadow-sm fw-bold btn-action-mobile" id="btnDeleteUser" onclick="confirmDeleteUser()">
                        <i class="bi bi-trash-fill me-1"></i>Borrar Usuario
                    </button>
                    <a id="btnEditHikerCrm" href="#" class="btn btn-outline-warning rounded-pill px-4 shadow-sm fw-bold btn-action-mobile text-dark d-none">
                        <i class="bi bi-pencil-square me-1"></i>Editar Ficha CRM
                    </a>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- Modal Personalizado Glassmorphic para Alertas y Confirmaciones -->
{% include 'partials/dashboard_content_modal.html' %}
