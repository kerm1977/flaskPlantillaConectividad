{% extends "base.html" %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-4">
            <div class="card border-0 shadow-sm p-4" style="border-radius:1.5rem;">
                <h2 class="fw-bold text-center text-orange mb-4">Iniciar sesión</h2>
                <form id="loginForm">
                    <input type="email" id="email" class="form-control rounded-3 mb-3" placeholder="Email" required>
                    <input type="password" id="password" class="form-control rounded-3 mb-3" placeholder="Contraseña" required>
                    <button type="submit" class="btn btn-orange w-100 rounded-pill fw-bold">Ingresar</button>
                </form>
                <p id="loginMsg" class="text-danger small text-center mt-3 mb-0"></p>
                <p class="text-center small mt-3 mb-0">
                    ¿No tienes cuenta? <a href="{{ url_for('main.register_page') }}" class="text-decoration-none fw-bold">Regístrate</a>
                </p>
            </div>
        </div>
    </div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value
        })
    });
    const data = await res.json();
    if (data.success) window.location.href = '/';
    else document.getElementById('loginMsg').textContent = data.error || 'Error al ingresar';
});
</script>
{% endblock %}
