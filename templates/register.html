{% extends 'base.html' %}
{% block content %}
<div class="hero-center">
    <div class="container py-5">
        <div class="card-pastel p-5 mx-auto" style="max-width:420px;">
            <div class="text-center mb-4">
                <i class="bi bi-person-plus pastel-icon-peach" style="font-size:3rem;"></i>
                <h2 class="fw-bold mt-2 text-main">Crear cuenta</h2>
            </div>
            <form id="registerForm" class="form-pastel text-start" onsubmit="handleRegister(event)">
                <div class="mb-3">
                    <label class="form-label text-muted-pastel fw-semibold small">Nombre</label>
                    <input type="text" id="name" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted-pastel fw-semibold small">Apellidos</label>
                    <input type="text" id="last_name" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted-pastel fw-semibold small">Email</label>
                    <input type="email" id="email" class="form-control" required>
                </div>
                <div class="mb-4">
                    <label class="form-label text-muted-pastel fw-semibold small">Contraseña</label>
                    <input type="password" id="password" class="form-control" required>
                </div>
                <button type="submit" class="btn-pastel btn-pastel-coral w-100 rounded-pill py-3 fw-bold">
                    <i class="bi bi-person-plus me-2"></i>Registrarse
                </button>
            </form>
            <div id="registerMsg" class="mt-3 small text-center"></div>
            <p class="text-center mt-4 mb-0 small text-muted-pastel">
                ¿Ya tienes cuenta? <a href="{{ url_for('main.login_page') }}" class="pastel-icon-sky fw-semibold">Ingresa</a>
            </p>
        </div>
    </div>
</div>
<script>
async function handleRegister(e){
    e.preventDefault();
    const data={name:document.getElementById('name').value, last_name:document.getElementById('last_name').value, email:document.getElementById('email').value, password:document.getElementById('password').value};
    const res=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    const json=await res.json();
    const msg=document.getElementById('registerMsg');
    if(res.ok){ window.location.href='/login'; }
    else { msg.textContent=json.error||'Error'; msg.className='mt-3 small text-danger'; }
}
</script>
{% endblock %}
