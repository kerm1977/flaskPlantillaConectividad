{% extends 'base.html' %}
{% block content %}
<div class="hero-center">
    <div class="container py-5">
        <div class="card-pastel p-5 mx-auto" style="max-width:420px;">
            <div class="text-center mb-4">
                <i class="bi bi-person-circle pastel-icon-sky" style="font-size:3rem;"></i>
                <h2 class="fw-bold mt-2 text-main">Iniciar sesión</h2>
            </div>
            <form id="loginForm" class="form-pastel text-start" onsubmit="handleLogin(event)">
                <div class="mb-3">
                    <label class="form-label text-muted-pastel fw-semibold small">Email</label>
                    <input type="email" id="email" class="form-control" placeholder="tu@email.com" required>
                </div>
                <div class="mb-4">
                    <label class="form-label text-muted-pastel fw-semibold small">Contraseña</label>
                    <input type="password" id="password" class="form-control" placeholder="Contraseña" required>
                </div>
                <button type="submit" class="btn-pastel w-100 rounded-pill py-3 fw-bold">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar
                </button>
            </form>
            <div id="loginMsg" class="mt-3 small text-center"></div>
            <p class="text-center mt-4 mb-0 small text-muted-pastel">
                ¿No tienes cuenta? <a href="{{ url_for('main.register_page') }}" class="pastel-icon-sky fw-semibold">Regístrate</a>
            </p>
        </div>
    </div>
</div>
<script>
async function handleLogin(e){
    e.preventDefault();
    const data={email:document.getElementById('email').value, password:document.getElementById('password').value};
    const res=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
    const json=await res.json();
    const msg=document.getElementById('loginMsg');
    if(res.ok){ window.location.href='/'; }
    else { msg.textContent=json.error||'Error'; msg.className='mt-3 small text-danger'; }
}
</script>
{% endblock %}
